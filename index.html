<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketly - Luxury E-Commerce Platform</title>
    <meta name="description" content="Premium single-vendor luxury e-commerce platform for curated fashion, watches, computing, and technology accessories." />
    <meta property="og:title" content="Marketly - Luxury E-Commerce Platform" />
    <meta property="og:description" content="Premium single-vendor luxury e-commerce platform for curated fashion, watches, computing, and technology accessories." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marketly" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marketly - Luxury E-Commerce Platform" />
    <meta name="twitter:description" content="Premium single-vendor luxury e-commerce platform for curated fashion, watches, computing, and technology accessories." />
    <link rel="canonical" href="https://marketly.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://marketly.com/#website",
            "url": "https://marketly.com",
            "name": "Marketly Luxury Commerce",
            "description": "Curated luxury fashion, watches, computing, and technology accessories",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://marketly.com/shop?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://marketly.com/#organization",
            "name": "Marketly",
            "url": "https://marketly.com",
            "logo": "https://marketly.com/logo.png"
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
